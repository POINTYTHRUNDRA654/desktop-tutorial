version: '3.8'

services:
  nemotron-api:
    build:
      context: .
      dockerfile: Dockerfile.nemotron
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - TRANSFORMERS_CACHE=/models
      - HUGGINGFACE_HUB_CACHE=/models
    volumes:
      - nemotron-models:/models
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  nemotron-models:
    driver: local
