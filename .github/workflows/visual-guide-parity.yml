name: Visual guide parity & tutorial checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  visual-guide-parity:
    name: Visual guide parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run visual-guide parity check
        run: npm run check:visual-guide

      - name: Verify tutorial text & images
        run: npm run verify:tutorial-parity

      - name: Run unit tests
        run: npm test --silent
