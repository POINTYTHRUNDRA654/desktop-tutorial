name: CI

on:
  push:
    branches: [main, master, develop, feature/*, copilot/*]
  pull_request:
    branches: [main, master, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-conflicts:
    name: Check for unresolved conflict markers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Detect conflict markers
        run: node scripts/check-no-conflict-markers.js

  brain-b-parity:
    name: Brain B fork parity check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false

      # Stdlib-only (ast, difflib, pathlib) — no requirements.txt needed.
      # See brain-b/check_parity.py's own docstring for why this exists: the
      # dev (gemma_service_enhanced.py) and shipped (nexus/brain_b_slim.py)
      # Brain B services have hand-duplicated router logic that's diverged
      # silently before. This fails the build instead of shipping it again.
      - name: Check classify_mode / retrieval_tuning parity
        run: python3 brain-b/check_parity.py

  papyrus-lint-selftest:
    name: Papyrus lint self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false

      # Stdlib-only (re, dataclasses, pathlib) — no requirements.txt needed.
      # This guards the guard: scripts/papyrus_lint.py is the mechanical
      # anti-pattern scanner (Utility.Wait() queuing, ApplyCrossFade/
      # RemoveCrossFade scope mismatch — see papyrusThreadingGotchas in
      # src/shared/FO4KnowledgeBase.ts) that the Blender add-on's own
      # generator (a separate repo) vendors a copy of to self-check its
      # output before ever writing a .psc file. If this regresses, that
      # self-check silently stops catching real bugs — same reasoning as
      # brain-b-parity above, applied to a linter instead of a fork.
      - name: Run papyrus_lint.py self-test
        run: python3 scripts/papyrus_lint.py --self-test

  verify:
    name: Verify (reproducible)
    needs: check-conflicts
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false
          lfs: true

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\electron-cache
            ${{ runner.temp }}\electron-builder-cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Configure npm for CI stability
        run: |
          npm config set fund false
          npm config set audit false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

      - name: Install dependencies (with retry)
        shell: pwsh
        run: |
          $retries = 3
          for ($i=1; $i -le $retries; $i++) {
            npm ci --prefer-offline --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "npm ci failed (attempt $i/$retries). Retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          Write-Host "npm ci failed after $retries attempts."
          exit 1

      - name: IPC handler contract guardrail
        run: npm run test:ipc-contract

      - name: Verify
        run: npm run verify

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Configure npm for CI stability
        run: |
          npm config set fund false
          npm config set audit false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
