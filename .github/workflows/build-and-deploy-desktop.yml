name: Build and Deploy Desktop App

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Build edition (universal or nvidia)'
        required: false
        default: 'universal'
        type: choice
        options:
          - universal
          - nvidia
          - both

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: ${{ github.event.inputs.edition == 'both' && fromJSON('["universal", "nvidia"]') || fromJSON(format('["{0}"]', github.event.inputs.edition || 'universal')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Configure npm for CI stability
        run: |
          npm config set fund false
          npm config set audit false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Run prepackage steps
        run: npm run prepackage
        continue-on-error: true

      - name: Get version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Package Universal Edition
        if: matrix.edition == 'universal'
        run: npx electron-builder --win
        timeout-minutes: 30
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Package NVIDIA Edition
        if: matrix.edition == 'nvidia'
        run: npm run package:win:nvidia
        timeout-minutes: 30
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mossy-${{ matrix.edition }}-${{ steps.version.outputs.VERSION }}
          path: release/*.exe
          retention-days: 7

      - name: List release directory
        if: always()
        run: |
          Write-Host "Contents of release directory:"
          Get-ChildItem -Path release -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
          
          Write-Host "`nExecutable files found:"
          Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $sizeMB MB"
          }
