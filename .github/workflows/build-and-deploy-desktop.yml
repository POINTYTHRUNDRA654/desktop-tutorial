name: Build and Deploy Desktop App

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Build edition (universal or nvidia)'
        required: false
        default: 'universal'
        type: choice
        options:
          - universal
          - nvidia
          - both

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-package:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: ${{ github.event.inputs.edition == 'nvidia' && fromJSON('["nvidia"]') || github.event.inputs.edition == 'universal' && fromJSON('["universal"]') || fromJSON('["universal", "nvidia"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false
          lfs: true

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> $env:GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Configure npm for CI stability
        run: |
          npm config set fund false
          npm config set audit false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Run prepackage steps
        run: npm run prepackage
        continue-on-error: true

      - name: Get version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($pkgVersion -ne $tagVersion) {
            Write-Error "Version mismatch: Git tag '${{ github.ref_name }}' is v$tagVersion but package.json has v$pkgVersion. Update package.json to match the tag before releasing."
            exit 1
          }
          Write-Host "✅ Tag v$tagVersion matches package.json version $pkgVersion"

      - name: Package Universal Edition
        if: matrix.edition == 'universal'
        run: npx electron-builder --win --publish never
        timeout-minutes: 30
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Package NVIDIA Edition
        if: matrix.edition == 'nvidia'
        run: npm run package:win:nvidia -- --publish never
        timeout-minutes: 30
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mossy-${{ matrix.edition }}-${{ steps.version.outputs.VERSION }}
          path: release/*.exe
          retention-days: 7

      - name: List release directory
        if: always()
        run: |
          Write-Host "Contents of release directory:"
          Get-ChildItem -Path release -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
          
          Write-Host "`nExecutable files found:"
          Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $sizeMB MB"
          }

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Mossy v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
