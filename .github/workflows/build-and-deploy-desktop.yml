name: Build and Deploy Desktop App

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Configure npm for CI stability
        run: |
          npm config set fund false
          npm config set audit false
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Run prepackage steps
        run: npm run prepackage

      - name: Delete existing draft releases (if any)
        continue-on-error: true
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "Checking for existing v$version releases..."
          
          $releases = gh release list --json tagName,name,isDraft | ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.tagName -eq "v$version" -or $release.name -like "*$version*") {
              Write-Host "Found release: $($release.tagName) (Draft: $($release.isDraft))"
              if ($release.isDraft) {
                Write-Host "Deleting draft release: $($release.tagName)"
                gh release delete $release.tagName --yes
              }
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish to GitHub Releases
        run: npx electron-builder --win --publish always
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
